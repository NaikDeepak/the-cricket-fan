name: bot-run
on:
  schedule:
    - cron: "0 */2 * * *"   # best-effort; tick logic is window-based
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = dry run, 0 = real post (scheduled cron ticks post live)"
        default: "1"
      force_trivia:
        description: "1 = ignore cooldown, force standalone trivia this tick (still skipped if a fixture is due within 24h)"
        default: "0"
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r bot/requirements.txt
      - run: python -m bot.run
        env:
          BOT_DATABASE_URL: ${{ secrets.BOT_DATABASE_URL }}
          BOT_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          BOT_FORCE_TRIVIA: ${{ github.event.inputs.force_trivia || '0' }}
          CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

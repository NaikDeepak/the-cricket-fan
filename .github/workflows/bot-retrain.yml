name: bot-retrain
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Refresh Cricsheet & retrain weekly on Mondays at 3:00 AM UTC
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r bot/requirements.txt
      - name: Download Cricsheet T20 archives
        run: |
          mkdir -p /tmp/cricsheet
          for comp in ipl hnd_male hnd_female wpl bbl_male wbb psl cpl_male sat mlc ilt lpl bpl ntb ssm_male ssm_female wcl cec wtb wsl wtc sma msl npl ctc frb t20s_male t20s_female; do
            curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              --retry 6 --retry-delay 5 --retry-all-errors \
              "https://cricsheet.org/downloads/${comp}_json.zip" \
              -o "/tmp/${comp}.zip" || continue
            unzip -oq "/tmp/${comp}.zip" -d "/tmp/cricsheet/${comp}"
            for f in /tmp/cricsheet/${comp}/*.json; do
              mv "$f" "/tmp/cricsheet/${comp}_$(basename "$f")"
            done
          done
      - name: Build league map
        run: |
          cat > /tmp/league_map.json <<'EOF'
          {
            "ipl": "IPL",
            "hnd_male": "The Hundred",
            "hnd_female": "The Hundred Women",
            "wpl": "WPL",
            "bbl_male": "BBL",
            "wbb": "WBBL",
            "psl": "PSL",
            "cpl_male": "CPL",
            "sat": "SA20",
            "mlc": "MLC",
            "ilt": "ILT20",
            "lpl": "LPL",
            "bpl": "BPL",
            "ntb": "T20 Blast",
            "ssm_male": "Super Smash",
            "ssm_female": "Super Smash Women",
            "wcl": "WCPL",
            "cec": "Charlotte Edwards Cup",
            "wtb": "Women's T20 Blast",
            "wsl": "WSL",
            "wtc": "Women's T20 Challenge",
            "sma": "SMAT",
            "msl": "MSL",
            "npl": "NPL",
            "ctc": "CSA T20",
            "frb": "FairBreak",
            "t20s_male": "T20I",
            "t20s_female": "WT20I"
          }
          EOF
      - name: Refresh feature store
        run: |
          python -m bot.ingest --cricsheet-dir /tmp/cricsheet \
            --league-map /tmp/league_map.json \
            --database-url "$BOT_DATABASE_URL"
        env:
          BOT_DATABASE_URL: ${{ secrets.BOT_DATABASE_URL }}
      - name: Train
        run: |
          python -m bot.train --cricsheet-dir /tmp/cricsheet \
            --league-map /tmp/league_map.json --out bot/artifacts
      - name: Commit artifact
        run: |
          git config user.name "bot-retrain"
          git config user.email "actions@github.com"
          git add bot/artifacts/
          git commit -m "chore(bot): retrain model artifact" || echo "no changes"
          git push
